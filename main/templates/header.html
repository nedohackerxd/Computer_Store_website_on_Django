<header class="navbar">
        <div class="container nav-container">
            <a href="/" class="logo">Computer Store</a>
            <nav class="nav-links">
                <a href="/" class="nav-link">Main page</a>
                <a href="/about/" class="nav-link">About</a>
                <a href="/contacts/" class="nav-link">Contacts</a>
            </nav>
            <div class="user-nav">
                {% if udata == "" %}
                    <a href="/sign-in/" class="nav-link">Sign in</a>
                    <a href="/sign-up/" class="btn btn-primary-sm">Sign up</a>
                {% else %}
                    <div class="user-menu">
                        <a href="/user-data/" class="user-name">{{ udata.name }}</a>
                        <a href="/sign-out/" class="sign-out-link">Sign out</a>
                    </div>
                {% endif %}
                <!-- Иконка корзины с кружком количества -->
                <a href="/cart/" class="header-cart-btn" title="View Cart">
                    <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    
                    {% if cart_total_quantity > 0 %}
                        <span class="cart-badge">{{ cart_total_quantity }}</span>
                    {% endif %}
                </a>
            </div>
        </div>
</header>
